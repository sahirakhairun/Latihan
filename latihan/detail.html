<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Tailed Beast</title>
  </head>

  <body>
    <div class="container mt-5 text-center">
      <!-- Gambar tetap di tengah -->
      <img
        id="beast-image"
        class="img-fluid"
        style="max-width: 300px"
        alt="Tailed Beast Image"
      />

      <!-- Informasi teks dan tombol di kiri -->
      <div class="row mt-4 justify-content-center">
        <div class="col-md-8 text-left">
          <h1 id="beast-name">Loading...</h1>
          <p class="mt-3 font-italic" id="beast-description"></p>

          <div id="info-section" class="mt-4"></div>

          <a href="index.html" class="btn btn-secondary mt-3">Back</a>
        </div>
      </div>
    </div>

    <script>
      // Ambil ID dari URL
      const params = new URLSearchParams(window.location.search);
      const beastId = params.get("id");

      if (beastId) {
        $.ajax({
          type: "GET",
          url: `https://narutodb.xyz/api/tailed-beast/${beastId}`,
          success: function (data) {
            $("#beast-name").text(data.name || "Tidak diketahui");

            // Menampilkan gambar (gunakan default jika tidak ada)
            let imageSrc =
              data.images && data.images.length > 0
                ? data.images[0]
                : "https://i.pinimg.com/originals/b7/21/09/b7210998b46a6a4f81a73a3edee6e30e.png";
            $("#beast-image").attr("src", imageSrc);

            // Menentukan deskripsi otomatis
            let description = "";
            if (
              data.natureType ||
              data.personal?.jinchūriki ||
              data.uniqueTraits
            ) {
              description = `Tailed Beast ${data.name} adalah salah satu dari sembilan Bijū yang diciptakan oleh Hagoromo Ōtsutsuki.`;
              if (data.natureType?.length)
                description += ` Memiliki elemen chakra: ${data.natureType.join(
                  ", "
                )}.`;
              if (data.personal?.jinchūriki?.length)
                description += ` Pernah menjadi Jinchūriki dari: ${data.personal.jinchūriki.join(
                  ", "
                )}.`;
              if (data.uniqueTraits?.length)
                description += ` Kemampuan uniknya: ${data.uniqueTraits.join(
                  ", "
                )}.`;
            }
            $("#beast-description").text(description);

            // Informasi tambahan
            let infoHTML = "";
            if (data.personal?.status)
              infoHTML += `<p><strong>Status:</strong> ${data.personal.status}</p>`;
            if (data.personal?.jinchūriki?.length)
              infoHTML += `<p><strong>Jinchūriki:</strong> ${data.personal.jinchūriki.join(
                ", "
              )}</p>`;
            if (data.personal?.affiliation?.length)
              infoHTML += `<p><strong>Affiliasi:</strong> ${data.personal.affiliation.join(
                ", "
              )}</p>`;
            if (data.natureType?.length)
              infoHTML += `<p><strong>Elemen Chakra:</strong> ${data.natureType.join(
                ", "
              )}</p>`;
            if (data.uniqueTraits?.length)
              infoHTML += `<p><strong>Kemampuan Unik:</strong> ${data.uniqueTraits.join(
                ", "
              )}</p>`;

            // Debut
            let debutHTML = "";
            if (data.debut?.manga)
              debutHTML += `<p><strong>Manga:</strong> ${data.debut.manga}</p>`;
            if (data.debut?.anime)
              debutHTML += `<p><strong>Anime:</strong> ${data.debut.anime}</p>`;
            if (data.debut?.game)
              debutHTML += `<p><strong>Game:</strong> ${data.debut.game}</p>`;
            if (data.debut?.movie)
              debutHTML += `<p><strong>Movie:</strong> ${data.debut.movie}</p>`;

            if (infoHTML) {
              $("#info-section").append(
                `<h3 class="mt-4">Informasi Tambahan</h3>${infoHTML}`
              );
            }
            if (debutHTML) {
              $("#info-section").append(
                `<h3 class="mt-4">Debut</h3>${debutHTML}`
              );
            }
          },
          error: function () {
            $("#beast-name").text("Data Not Found");
            $("#beast-description").text(
              "Tailed Beast dengan ID ini tidak ditemukan."
            );
          },
        });
      } else {
        $("#beast-name").text("No ID Provided");
        $("#beast-description").text("Tidak ada ID yang diberikan dalam URL.");
      }
    </script>
  </body>
</html>
