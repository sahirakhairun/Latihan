<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naruto All Character</title>
  </head>

  <body>
    <div class="container text-center mt-5">
      <h1 class="mb-4">Naruto All Character</h1>
      <div class="row card-naruto"></div>
    </div>

    <script>
      $.ajax({
        type: "GET",
        url: "https://narutodb.xyz/api/tailed-beast",
        success: function (data) {
          console.log(data);

          let jumlahArray = data.tailedBeasts.length;

          for (let i = 0; i < jumlahArray; i++) {
            let tailedBeastsId = data.tailedBeasts[i].id;
            let tailedBeastsName = data.tailedBeasts[i].name;
            let tailedBeastsimage = data.tailedBeasts[i].images[0];

            if (tailedBeastsimage == null) {
              tailedBeastsimage =
                "https://www.kindpng.com/picc/m/89-891851_9-kurama-naruto-nine-tails-transparent-hd-png.png";
            }

            $(".card-naruto").append(
              `<div class="col-md-4">
                  <div class="card" style="width: 100%; margin-bottom: 20px">
                      <img src="${tailedBeastsimage}" class="card-img-top" alt="">
                      <div class="card-body">
                          <h5 class="card-title">${tailedBeastsName}</h5>
                          <a href="detail.html?id=${tailedBeastsId}" class="btn btn-primary">Detail</a>
                      </div>
                  </div>
              </div>`
            );
          }
        },
        error: function (err) {
          console.error("Error fetching data:", err);
        },
      });
    </script>
  </body>
</html>
